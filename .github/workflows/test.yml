name: Quant System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Dummy Secrets for CI
      run: |
        mkdir -p .streamlit
        echo '[system]' > .streamlit/secrets.toml
        echo 'hmac_secret = "ci_dummy_secret_123"' >> .streamlit/secrets.toml
        echo '[kis_accounts.core]' >> .streamlit/secrets.toml
        echo 'is_mock = "true"' >> .streamlit/secrets.toml
        echo 'app_key = "dummy"' >> .streamlit/secrets.toml
        echo 'app_secret = "dummy"' >> .streamlit/secrets.toml
        
    - name: Run Integrity Tests (Pytest)
      env:
        CI_TEST_MODE: "true"
      run: |
        pytest test_quant.py -v --disable-warnings
