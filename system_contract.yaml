whitepaper_version: "2.2.0"
contract_version: "2.2.0"
schema_version: 16
strategy_version: "1.0.0"
cost_model_version: "2.2.0"

strategy:
  CORE:
    ma200: true
    buf: 0.015
    sl: -0.15
    alloc: 0.35
    ts_tgt: 0.30
    ts_drp: -0.10
    cd: 3
    min_h: 5
    boost: true
  SATELLITE:
    ma200: true
    buf: 0.010
    sl: -0.12
    alloc: 0.20
    ts_tgt: 0.20
    ts_drp: -0.07
    cd: 3
    min_h: 3
    boost: true

booster_policy:
  mode: "ABSOLUTE_ADDITION"
  value: 0.10

trend_exit:
  buffer_factor: 0.5

execution_rules:
  require_two_distinct_1min_bars: true
  quote_freshness_ttl_sec: 15
  intent_ttl_sec: 300
  market_buy_reservation_buffer: 1.05
  cash_policy: "CASH_ONLY_NO_CREDIT"
  real_approval_status: "POST_BLOCKED"

cooldown_policy:
  loss_streak_threshold: 2
  cooldown_sessions: 3
  rearm_condition: "SIGNAL_FALSE_TO_TRUE"

cost_model:
  broker_fee_rate: 0.00015
  org_fee_rate: 0.000036
  buy_slippage_rate: 0.001
  sell_slippage_rate: 0.001
  legacy_all_in_025_mode: false
  tax_schedule:
    2022: {"KOSPI": 0.0023, "KOSDAQ": 0.0023}
    2023: {"KOSPI": 0.0020, "KOSDAQ": 0.0020}
    2024: {"KOSPI": 0.0018, "KOSDAQ": 0.0018}
    2025: {"KOSPI": 0.0015, "KOSDAQ": 0.0015}
    2026: {"KOSPI": 0.0020, "KOSDAQ": 0.0020}

allowed_state_transitions:
  INTENT_CREATED: ["CLAIMED", "CANCELED", "QUARANTINED", "EXPIRED"]
  CLAIMED: ["SUBMITTING", "CANCELED", "RISK_REJECTED", "EXPIRED", "QUARANTINED", "INTENT_CREATED"]
  SUBMITTING: ["ACKNOWLEDGED", "REJECTED", "UNKNOWN", "FILLED", "CANCELED"]
  ACKNOWLEDGED: ["PARTIALLY_FILLED", "FILLED", "CANCEL_REQUESTED", "CANCELED"]
  PARTIALLY_FILLED: ["FILLED", "CANCEL_REQUESTED", "CANCELED"]
  UNKNOWN: ["ACKNOWLEDGED", "FILLED", "REJECTED", "CANCELED", "RECONCILIATION_REQUIRED"]
  CANCEL_REQUESTED: ["CANCEL_CLAIMED", "CANCEL_SUBMITTING", "CANCEL_ACKNOWLEDGED", "CANCEL_UNKNOWN", "FILLED", "REJECTED", "CANCELED"]
  CANCEL_CLAIMED: ["CANCEL_SUBMITTING", "CANCEL_REQUESTED"]
  CANCEL_SUBMITTING: ["CANCEL_ACKNOWLEDGED", "CANCEL_UNKNOWN", "REJECTED", "CANCELED"]
  CANCEL_UNKNOWN: ["CANCELED", "FILLED", "CANCEL_ACKNOWLEDGED"]
  CANCEL_ACKNOWLEDGED: ["CANCELED", "FILLED"]
  RECONCILIATION_REQUIRED: ["FILLED", "CANCELED", "REJECTED"]
  FILLED: []
  CANCELED: []
  REJECTED: []
  RISK_REJECTED: []
  QUARANTINED: []
  EXPIRED: []